[skills.experiment]
display_name = "Experiment"
tagline = "Settle subjective questions by blind, evidence-driven comparison."
short_summary = "Produce 2-4 candidate outputs, strip provenance, collect external judge verdicts, then let the user rule — no guessing."
full_summary = "When a question can only be answered by trying (not by research or direct user knowledge), this skill runs a controlled experiment. It frames a single criterion, produces 2–4 candidates (at least one by the main agent, the rest by pinned external agents), blinds them by shuffling and stripping provenance, and sends them to 2–3 different external judges for ranking with justification. The user receives the anonymized candidates and verdicts, rules on the winner, and only then sees the provenance mapping. The experimental directory is deleted as cleanup."

[[skills.experiment.highlights]]
title = "Single Criterion"
description = "Every experiment has exactly one criterion that the candidates compete on. A candidate set without a criterion is taste-polling, not an experiment."

[[skills.experiment.highlights]]
title = "Provenance Stripping"
description = "Candidates are shuffled into letter-named files (A, B, …) with all provenance hints removed. The letter-to-producer mapping is written to mapping.txt and never shown before the ruling."

[[skills.experiment.highlights]]
title = "External Judge Panel"
description = "2–3 different external agents, pinned by model, each receive the blinded candidates and criterion. Every judge ranks the candidates and justifies its ranking in two sentences."

[[skills.experiment.highlights]]
title = "Safe External Production"
description = "External agents never write to a repo directly. When a future experiment needs repo access, a git worktree is created first; changes are collected via worktree diff, merging stays an explicit main-thread step."

[[skills.experiment.workflow]]
name = "Frame & Produce"
description = "Name the experiment and write the criterion. Produce 2–4 candidates."
details = "Name the experiment (kebab-case) and define the single criterion. Render 2–4 candidates into a temp directory, producing at least one yourself and dispatching external-agent briefs for the rest."

[[skills.experiment.workflow]]
name = "Blind"
description = "Shuffle, strip provenance, write mapping."
details = "Copy candidates to letter-named files (A, B, …) in shuffled order, stripping all provenance hints. Write the letter-to-producer mapping to mapping.txt."

[[skills.experiment.workflow]]
name = "Judge"
description = "Send blinded candidates to 2–3 external judges in parallel."
details = "Each judge receives the letter-named candidates and the criterion via an external-agent brief (pinned by model, tagged auditing). Each ranks and justifies in two sentences."

[[skills.experiment.workflow]]
name = "Rule & Conclude"
description = "Present verdicts, user rules, reveal mapping, clean up."
details = "Show the candidates and anonymized verdicts to the user. The user rules. Reveal the provenance mapping only after the ruling, report the outcome, then delete the experiment directory."

[skills.explore]
display_name = "Explore Design Discussions"
tagline = "Ask, sort, research, experiment — the model drives, the user rules."
short_summary = "A design-discussion skill that turns open questions into evidence-backed decisions using Ask, Sort, Research, and Experiment moves."
full_summary = "Explore drives design discussions through four moves: Ask, Sort, Research, and Experiment. Ask raises purpose, alternative, and shortcut questions at the model first, then brings the user only well-shaped user-bound questions; Sort classifies every open question as world fact, user-held fact, or judgment; Research settles world facts through the cheapest sufficient source; Experiment creates evidence when nothing existing holds the answer. The model drives; each pass ends with labeled findings."
source_hash = "b5fcbc31521b9058"
content_hash = "afa039a48f26b9ca"

[[skills.explore.highlights]]
title = "Four Disciplined Moves"
description = "Ask, Sort, Research, and Experiment structure every design question. Questions are sorted as world fact, user-held fact, or judgment before any work proceeds, and unsorted questions never reach the user."

[[skills.explore.highlights]]
title = "Model Drives, User Rules"
description = "The model raises the hard questions itself and answers everything its own instruments can reach, leaving the user only their own facts and rulings — never legwork."

[[skills.explore.highlights]]
title = "Cheapest Sufficient Evidence"
description = "Research follows a source order of memory, this machine, then the web. Load-bearing recalled facts are verified against their sources before a recommendation rests on them."

[[skills.explore.highlights]]
title = "Transparent Rulings"
description = "Every pass presents purpose, explored alternatives, the strongest shortcut, and the recommendation, with facts, judgments, assumptions, and parked items each labeled as what they are."

[[skills.explore.workflow]]
name = "Ask"
description = "Raise purpose, alternatives, and shortcut questions, then bring user-bound questions."
details = "Raise purpose, alternatives, and shortcut questions at the model first; keep the best-guess summary and open question list visible; ask one call of up to four well-shaped user-bound questions."

[[skills.explore.workflow]]
name = "Sort"
description = "Classify every open question before any work proceeds."
details = "Mark each question as world fact, user-held fact, or judgment; mark user-bound questions; route third-party or access-gated facts as routing requests; prepare ambiguous questions as judgments."

[[skills.explore.workflow]]
name = "Research"
description = "Settle world facts through the cheapest sufficient source."
details = "Follow memory, this machine, then the web, escalating only when a source cannot settle. Verify load-bearing recalls, run one scouting pass per settled intent, and compile a digest naming gaps."

[[skills.explore.workflow]]
name = "Experiment"
description = "Create evidence when nothing existing holds the answer."
details = "Run probes against real artifacts, record commands and outputs beside briefs, and get go-ahead for trials that spend money or touch external systems. Invoke /attune:experiment for blind comparisons."

[[skills.explore.workflow]]
name = "Present"
description = "Present the pass's findings with all items labeled."
details = "State current purpose, explored alternatives, strongest shortcut, recommendation with rationale, and unverified or parked items. Label facts, evidence, judgments, and recommendations as such."
